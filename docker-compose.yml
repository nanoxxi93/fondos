services:
  api:
    container_name: api-fondos
    image: nanoxxi93/api-fondos
    build: .
    env_file: .env.development
    ports:
      - "5001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1"
          memory: 256M
